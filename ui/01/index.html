<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RocketRecap | Neural Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #050510;
            --accent-orange: #FF8C00;
            --accent-cyan: #00f3ff;
            --accent-magenta: #ff00ff;
            --glass-surface: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* --- BACKGROUND LATENT SPACE --- */
        #latent-space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .cluster-label {
            position: absolute;
            color: var(--text-secondary);
            font-size: 0.8rem;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 1;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            opacity: 0.8;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 80px;
            height: 100%;
            background: rgba(5, 5, 16, 0.6);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 0;
            z-index: 10;
            justify-content: space-between;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
            border-radius: 12px;
            margin-bottom: 3rem;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            flex-grow: 1;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-icon:hover, .nav-icon.active {
            background: rgba(255,255,255,0.1);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        /* --- MAIN INTERFACE --- */
        .main-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .glass-card {
            width: 800px;
            background: var(--glass-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.5),
                inset 0 0 0 1px rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        /* Subtle rim light effect */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.5), transparent);
        }

        .header-content {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-weight: 300;
            font-size: 1.1rem;
        }

        /* --- INPUT SECTION --- */
        .input-wrapper {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.5rem;
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .mode-toggle {
            display: flex;
            gap: 0.5rem;
            padding-left: 1rem;
            border-right: 1px solid rgba(255,255,255,0.1);
            padding-right: 1rem;
            color: var(--text-secondary);
        }

        .icon-btn {
            cursor: pointer;
            padding: 0.2rem;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        
        .icon-btn.active {
            opacity: 1;
            color: var(--accent-cyan);
        }

        input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 1rem;
            font-size: 1rem;
            outline: none;
        }

        input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .summarize-btn {
            background: var(--accent-orange);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.3);
            transition: all 0.3s ease;
        }

        .summarize-btn:hover {
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.6);
            transform: translateY(-1px);
        }

        /* --- MAP STATUS WIDGET (Bottom Left) --- */
        .map-status {
            position: absolute;
            bottom: 2rem;
            left: 7rem; /* Offset for sidebar */
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            backdrop-filter: blur(10px);
            z-index: 5;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* --- NEIGHBORHOOD PREVIEW (Right side of card) --- */
        .neighborhood-widget {
            position: absolute;
            right: -180px;
            top: 50%;
            transform: translateY(-50%);
            width: 160px;
            height: 160px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--accent-cyan);
            border-radius: 50%;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }
        
        .connector-line {
            position: absolute;
            right: 0;
            top: 50%;
            width: 100px; /* Connects card to widget */
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.1), var(--accent-cyan));
            z-index: -1;
        }

        .widget-inner {
            text-align: center;
            font-size: 0.6rem;
            color: var(--accent-cyan);
        }

    </style>
</head>
<body>

    <!-- Background Latent Space -->
    <canvas id="latent-space-canvas"></canvas>

    <!-- Floating Labels for 3D Feel -->
    <div class="cluster-label" style="top: 20%; left: 15%; color: var(--accent-cyan);">Physics</div>
    <div class="cluster-label" style="top: 25%; right: 20%; color: var(--accent-magenta);">Philosophy</div>
    <div class="cluster-label" style="bottom: 30%; left: 30%; color: #ffd700;">History</div>
    <div class="cluster-label" style="top: 15%; left: 60%; color: #00ff88;">Coding</div>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="top-section">
            <div class="logo-icon"></div>
            <div class="nav-items">
                <div class="nav-icon active" title="Home"></div>
                <div class="nav-icon" title="Explore"></div>
                <div class="nav-icon" title="Saved"></div>
            </div>
        </div>
        <div class="nav-icon" title="Settings"></div>
    </nav>

    <!-- Map Status Pill -->
    <div class="map-status">
        <div class="status-dot"></div>
        <span>Map Status: 8,000 Nodes Loaded</span>
    </div>

    <!-- Main UI -->
    <main class="main-container">
        <div class="glass-card">
            
            <div class="header-content">
                <h1>RocketRecap</h1>
                <p class="subtitle">Reclaim control from recommendation algorithms.</p>
            </div>

            <div class="input-wrapper">
                <div class="mode-toggle">
                    <!-- SVG Icons for Video/Text -->
                    <div class="icon-btn active" title="Video Mode">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.582,5.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,3,12,3,12,3S5.746,3,4.186,3.418 c-0.86,0.23-1.538,0.908-1.768,1.768C2,6.746,2,12,2,12s0,5.254,0.418,6.814c0.23,0.86,0.908,1.538,1.768,1.768 C5.746,21,12,21,12,21s6.254,0,7.814-0.418c0.861-0.23,1.538-0.908,1.768-1.768C22,17.254,22,12,22,12S22,6.746,21.582,5.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>
                    </div>
                    <div class="icon-btn" title="Text Mode">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14,2H6C4.9,2,4,2.9,4,4v16c0,1.1,0.9,2,2,2h12c1.1,0,2-0.9,2-2V8L14,2z M16,18H8v-2h8V18z M16,14H8v-2h8V14z M13,9V3.5 L18.5,9H13z"/></svg>
                    </div>
                </div>
                <input type="text" placeholder="Paste YouTube Link or Text here...">
                <button class="summarize-btn">SUMMARIZE</button>
            </div>

            <div style="margin-top: 1rem; display: flex; gap: 1rem; opacity: 0.7; font-size: 0.9rem;">
                <span style="color: var(--accent-cyan); border-bottom: 1px solid var(--accent-cyan); cursor: pointer;">Show Neighborhood</span>
                <span style="cursor: pointer;">My Galaxy</span>
            </div>

            <!-- Decorative Neighborhood Widget Connector (Visual Only) -->
            <div class="connector-line"></div>
            <div class="neighborhood-widget">
                <div class="widget-inner">
                    <div style="font-weight:700; font-size: 0.8rem; color: white;">Local Map</div>
                    <div>Scanning...</div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- UMAP VISUALIZATION ENGINE ---
        const canvas = document.getElementById('latent-space-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        
        // Configuration for "Clusters"
        const clusters = [
            { x: 0.2, y: 0.3, color: '#00f3ff', label: 'Physics' },
            { x: 0.8, y: 0.3, color: '#ff00ff', label: 'Philosophy' },
            { x: 0.5, y: 0.8, color: '#FF8C00', label: 'History' },
            { x: 0.5, y: 0.2, color: '#00ff88', label: 'Coding' }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                // Randomly assign to a cluster with some spread
                const cluster = clusters[Math.floor(Math.random() * clusters.length)];
                
                // Gaussian-ish distribution around cluster center
                const spreadX = (Math.random() - 0.5) * width * 0.6;
                const spreadY = (Math.random() - 0.5) * height * 0.6;

                this.x = (cluster.x * width) + spreadX;
                this.y = (cluster.y * height) + spreadY;
                
                // Color based on cluster or generic star
                this.color = Math.random() > 0.3 ? cluster.color : '#ffffff';
                
                this.size = Math.random() * 2;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.alpha = Math.random() * 0.5 + 0.1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Wrap around screen
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
            }
        }

        function initParticles(count) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Connections (Constellations)
            // Only draw lines between particles that are close
            ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // Simple check for connections (optimization: don't check all against all in full production)
                // For this demo, we just check adjacent array indices for performance
                for (let j = i + 1; j < i + 5 && j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = particles[i].color; // Use particle color
                        ctx.globalAlpha = 0.15; // Faint lines
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initParticles(400); // Reset on resize
        });

        resize();
        initParticles(400); // 400 nodes
        animate();

    </script>
</body>
</html>
